name: Duck Hub Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Validate Astro components
        run: pnpm astro:check
      - name: Build project Pages artifact without deploying
        run: pnpm exec astro build
        env:
          GITHUB_ACTIONS: 'true'
      - name: Verify built routes, navigation and local assets
        run: node scripts/verify-pages.mjs
