name: Publish Duck Hub — Astro
# Publication requires a separate reviewed, explicit dispatch after rights and privacy checks.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Dependency lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate TypeScript and Astro pages
        run: |
          pnpm check
          pnpm astro:check
      - name: Run product and Pages regression tests
        run: |
          pnpm test
          node --test scripts/verify-pages.test.mjs
      - name: Compile real Astro static site
        run: pnpm exec astro build
        env:
          GITHUB_ACTIONS: 'true'
      - name: Verify static pages and assets
        run: node scripts/verify-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
